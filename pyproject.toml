[project]
name = "sitegen"
version = "0.2.0"
description = "Synthetic construction-site MCAP generator with held-out ground truth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcap>=1.4.0",
    "mcap-protobuf-support>=0.5.4",
    "foxglove-schemas-protobuf>=0.4.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "trimesh>=5.1.0",
    "embreex>=4.0",
]

[project.scripts]
sitegen = "sitegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyrefly>=1.0", "pytest>=9.0"]

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = ["**/.venv/**", "**/.[!/.]*"]
python-version = "3.12"
python-interpreter-path = ".venv/bin/python"
